name: Deploy a Cloud Run

# Build + push a Artifact Registry + deploy a Cloud Run.
# Auth con Workload Identity Federation (sin llaves de servicio en GitHub).
# Configura estos secrets/vars en el repo:
#   vars:    GCP_PROJECT_ID, GCP_REGION, WIF_PROVIDER, DEPLOY_SA
#   (los NEXT_PUBLIC_* de build pueden ir como vars del repo)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: ${{ vars.GCP_REGION }}
  PROJECT: ${{ vars.GCP_PROJECT_ID }}
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/casana

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # requerido para WIF
    strategy:
      matrix:
        app:
          - { name: api, service: casana-api, dockerfile: apps/api/Dockerfile }
          - { name: landing, service: casana-landing, dockerfile: apps/landing/Dockerfile }
          - { name: web-patron, service: casana-web-patron, dockerfile: apps/web-patron/Dockerfile }
          - { name: backoffice, service: casana-backoffice, dockerfile: apps/backoffice/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ matrix.app.name }}:${{ github.sha }}"
          docker build -f ${{ matrix.app.dockerfile }} \
            --build-arg NEXT_PUBLIC_API_URL="${{ vars.NEXT_PUBLIC_API_URL }}" \
            --build-arg NEXT_PUBLIC_APP_URL="${{ vars.NEXT_PUBLIC_APP_URL }}" \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}" \
            -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy a Cloud Run
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ matrix.app.name }}:${{ github.sha }}"
          gcloud run deploy ${{ matrix.app.service }} \
            --image "$IMAGE" \
            --region "${{ env.REGION }}" \
            --quiet
